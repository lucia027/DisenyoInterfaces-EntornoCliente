
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica Bootstrap Responsive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Contenedor principal -->
    <main class="container-fluid px-3 px-md-4 my-4">
        <div class="row g-3">

            <!-- Menú responsive -->
            <div class="col-12">
                <nav class="navbar navbar-expand-md bg-light border px-3">

                    <button class="navbar-toggler" type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#menu"
                            aria-controls="menu"
                            aria-expanded="false"
                            aria-label="Abrir menú">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="menu">
                        <span class="navbar-text">Menú</span>
                    </div>

                </nav>
            </div>

            <!-- Primera fila: 8 + 4 -->
            <div class="col-12 col-md-8">
                <div class="bg-primary-subtle border border-primary p-5"></div>
            </div>

            <div class="col-12 col-md-4">
                <div class="bg-success-subtle border border-success p-5"></div>
            </div>

            <!-- Segunda fila: 6 + 6 -->
            <div class="col-12 col-md-6">
                <div class="bg-warning-subtle border border-warning p-5"></div>
            </div>

            <div class="col-12 col-md-6">
                <div class="bg-danger-subtle border border-danger p-5"></div>
            </div>

            <!-- Tercera fila: 6 + 6 -->
            <div class="col-12 col-md-6">
                <div class="bg-info-subtle border border-info p-3 h-100">
                    <p class="mb-0">Contenido de ejemplo</p>
                </div>
            </div>

            <!-- Contenedor padre de 6 columnas -->
            <div class="col-12 col-md-6">
                <div class="bg-secondary-subtle border border-secondary p-3 h-100">

                    <!-- Formulario con dos columnas interiores -->
                    <form class="row g-2">

                        <!-- Email: 8 columnas -->
                        <div class="col-12 col-md-8">
                            <div class="bg-primary-subtle border border-primary p-2 h-100">

                                <label for="email" class="form-label">
                                    Email
                                </label>

                                <input type="email"
                                       class="form-control"
                                       id="email"
                                       placeholder="Introduce tu email">

                            </div>
                        </div>

                        <!-- Checkbox: 4 columnas -->
                        <div class="col-12 col-md-4">
                            <div class="bg-danger-subtle border border-danger p-2 h-100">

                                <div class="form-check">
                                    <input type="checkbox"
                                           class="form-check-input"
                                           id="acepto">

                                    <label for="acepto" class="form-check-label">
                                        Acepto
                                    </label>
                                </div>

                            </div>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </main>

    <!-- JavaScript de Bootstrap para el menú -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
