<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía de fotocopias 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">

</head>
<body class="bg-body text-body">
    <main class="py-4 row g-3">
        <div class="col-12 titulo-con-imagenes">
            <img src="flecha1.png" alt="Flecha 1" class="img-fluid">
            <h1 class="text-primary ">Contenido de la página</h1>
            <img src="flecha2.png" alt="Flecha 2" class="img-fluid">    
        </div>

        <div class="d-flex gap-3">
            <div class="col-3 d-none d-md-block bg-body-tertiary">
                <div class="accordion" id="accordionPanelsStayOpenExample">
                  <div class="accordion-item">
                    <h2 class="accordion-header">
                      <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#panelsStayOpen-collapseOne" aria-expanded="true" aria-controls="panelsStayOpen-collapseOne">
                        HelloKitty
                      </button>
                    </h2>
                    <div id="panelsStayOpen-collapseOne" class="accordion-collapse collapse show">
                      <div class="accordion-body">
                        <img src="hello-kitty.png" alt="Hello Kitty" class="img-fluid">
                      </div>
                    </div>
                  </div>
                  <div class="accordion-item">
                    <h2 class="accordion-header">
                      <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#panelsStayOpen-collapseTwo" aria-expanded="false" aria-controls="panelsStayOpen-collapseTwo">
                        My Melody
                      </button>
                    </h2>
                    <div id="panelsStayOpen-collapseTwo" class="accordion-collapse collapse">
                      <div class="accordion-body">
                        <img src="my-melody.png" alt="My Melody" class="img-fluid">
                      </div>
                    </div>
                  </div>
                </div>
            </div>

            <div class="col-6 bg-body-secondary">
                <p class="text-center">Contenido principal</p>
            </div>

            <div class="col-3 d-none d-md-block bg-body-tertiary">
                <p class="text-center">Columna derecha</p>
            </div>
        </div>
    </main>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</html>
