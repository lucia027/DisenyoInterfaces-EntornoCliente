<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panadería Sol</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; color: #1A2333; }

  /* Texto solo para lectores de pantalla */
  .sr {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }

  /* ---------- Móvil (estilos base) ---------- */
  .cabecera {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    padding: .75rem 1rem;
    background: #1F3A5F;
    color: #fff;
  }
  .logo { color: #fff; font-weight: 700; font-size: 1.2rem; text-decoration: none; }

  .menu-boton {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    background: transparent;
    border: 2px solid rgba(255,255,255,.6);
    border-radius: 8px;
    cursor: pointer;
  }
  .barras,
  .barras::before,
  .barras::after {
    display: block;
    width: 20px; height: 2px;
    background: #fff;
  }
  .barras { position: relative; }
  .barras::before,
  .barras::after { content: ""; position: absolute; left: 0; }
  .barras::before { top: -6px; }
  .barras::after  { top: 6px; }

  .menu { display: none; width: 100%; }
  .menu.abierto { display: block; }

  .menu ul { list-style: none; margin: .5rem 0 0; padding: 0; }
  .menu a {
    display: flex; align-items: center;
    min-height: 44px;
    padding: 0 .5rem;
    color: #fff; text-decoration: none;
    border-top: 1px solid rgba(255,255,255,.15);
  }

  main { padding: 1rem; max-width: 60ch; }

  /* ---------- Desde 640px ---------- */
  @media (min-width: 640px) {
    .menu-boton { display: none; }
    .menu { display: block; width: auto; }
    .menu ul { display: flex; gap: .25rem; margin: 0; }
    .menu a { border-top: 0; min-height: 40px; padding: 0 .75rem; border-radius: 6px; }
    .menu a:hover { background: rgba(255,255,255,.15); }
  }
</style>
</head>
<body>
  <header class="cabecera">
    <a class="logo" href="#">Panadería Sol</a>

    <button class="menu-boton" aria-expanded="false" aria-controls="menu">
      <span class="sr">Abrir menú</span>
      <span class="barras" aria-hidden="true"></span>
    </button>

    <nav id="menu" class="menu" aria-label="Principal">
      <ul>
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Panes</a></li>
        <li><a href="#">Bollería</a></li>
        <li><a href="#">Encargos</a></li>
        <li><a href="#">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Pan de masa madre, cada mañana</h1>
    <p>Prueba a estrechar el marco por debajo de 640 px y pulsa el botón de las tres rayas.</p>
  </main>

  <script>
    const boton = document.querySelector('.menu-boton');
    const menu = document.getElementById('menu');

    boton.addEventListener('click', () => {
      const abierto = menu.classList.toggle('abierto');
      boton.setAttribute('aria-expanded', abierto);
      boton.querySelector('.sr').textContent = abierto ? 'Cerrar menú' : 'Abrir menú';
    });
  </script>
</body>
</html>
