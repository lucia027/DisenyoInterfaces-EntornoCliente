<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Optica</title>
</head>
<body>
    
    <!-- Menu -->    
    <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body rounded" data-bs-theme="dark">
        <a class="navbar-brand mx-auto fs-2" href="#" ><i class="bi bi-shop"></i>Optica Boops</a>
    </nav>

    <p class="fs-3 fw-bold">Solicita información de nuestros servicios: </p>    


    <div  class="row g-3">
        <div class="input-group ">
            <span class="input-group-text">Nombre</span>
            <div class="form-floating">
                <input type="text" class="form-control" id="nombre" placeholder="nombre">
                <label for="nombre">Tu nombre</label>
            </div>
        </div>

        <div class="input-group ">
            <span class="input-group-text">Email</span>
            <div class="form-floating">
                <input type="email" class="form-control" id="email" placeholder="email">
                <label for="email">Tu email</label>
            </div>
        </div>  

        <div class="input-group ">
            <span class="input-group-text">Teléfono</span>
            <div class="form-floating">
                <input type="tel" class="form-control" id="telefono" placeholder="teléfono">
                <label for="telefono">Tu teléfono, empezado en 6, 7 o 9</label>
            </div>
        </div>

        <div class="input-group ">
            <span class="input-group-text">Codigo postal</span>
            <div class="form-floating">
                <input type="text" class="form-control" id="codigoPostal" placeholder="codigo postal">
                <label for="codigoPostal">Tu código postal</label>
            </div>
        </div>

        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="isGafas" id="r1" value="gafas">
            <label class="form-check-label" for="r1">Gafas</label>
        </div>

        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="isGafas" id="r2" value="lentes">
            <label class="form-check-label" for="r2">Lentes de contacto</label>
        </div>

        

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
