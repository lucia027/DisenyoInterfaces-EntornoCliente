<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de clics</title>
</head>
<body>
    <h1>Contador de clics</h1>
    <p>Has pulsado el boton <span id="Contador">0</span></p>
    <button id="botonContador">Pulsa aqui.</button>
    <button id="botonReinicio">Reiniciar.</button>

    <script>
        let contador = 0;
        const spanContador = document.getElementById("Contador");
        const boton = document.getElementById("botonContador");
        const botonReinicio = document.getElementById("botonReinicio");
        boton.addEventListener("mouseover", () => {
            contador++;
            spanContador.textContent = contador;
        })

        botonReinicio.addEventListener("click", () => {
            contador = 0;
            spanContador.textContent = contador;
        })

        const dias = ["Lunes", "Martes", "Miercoles", "Jueves", "Viernes"];
        const mes = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
        const hoy = new Date();
        const texto = `Hoy es ${dias[hoy.getDay()]} ${hoy.getDate()}, de ${mes[hoy.getMonth()]}`;
        document.getElementById("Fecha").textContent = texto;



    </script>
</body>
</html>
