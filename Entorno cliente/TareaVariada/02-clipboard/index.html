<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Copiar dirección</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h2>Ficha cliente</h2>
    <label for="direccion">Dirección:</label>
    <input type="text" id="direccion" value="Calle Mayor, 12, Madrid" class="form-control mb-2" style="max-width: 400px">
    <button class="btn btn-primary" onclick="copiarDireccion()">Copiar dirección</button>
    <p id="mensaje" class="mt-2"></p>
    <!-- Copy Text to Clipboard de W3Schools -->
    <script>
        async function copiarDireccion() {
            var texto = document.getElementById('direccion');
            texto.select();
            texto.setSelectionRange(0, 99999);
            try {
                await navigator.clipboard.writeText(texto.value);
                document.getElementById('mensaje').textContent = 'Dirección copiada';
            } catch (error) {
                document.getElementById('mensaje').textContent = 'No se pudo copiar automáticamente. Pulsa Ctrl+C.';
            }
        }
    </script>
</body>
</html>
